<html lang="it">
<head>
<meta charset="utf-8">

<style>
/* Direzione: modulo fiscale. Riquadri a filo sottile, etichette in mono, un solo gesto audace: l'evidenziatore giallo sullo stato corrente. */
:root {
  --paper: #F4F5F8; --card: #FFFFFF; --ink: #0E1A2B; --muted: #5A667A; --line: #D8DDE6;
  --accent: #1B3BF0; --accent-ink: #FFFFFF; --mark: #FFE066; --mark-ink: #0E1A2B;
  --ok: #146C43; --ok-bg: #E2F3EA; --warn: #8A5200; --warn-bg: #FFF0D1; --bad: #A8261D; --bad-bg: #FBE3E0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A111F; --card: #111A2D; --ink: #E9EEF8; --muted: #98A5BB; --line: #25314A;
    --accent: #8097FF; --accent-ink: #0A111F; --mark: #FFD84D; --mark-ink: #0E1A2B;
    --ok: #62D39B; --ok-bg: #11301F; --warn: #F2B85A; --warn-bg: #33250C; --bad: #FF8F86; --bad-bg: #3A1714;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A111F; --card: #111A2D; --ink: #E9EEF8; --muted: #98A5BB; --line: #25314A;
  --accent: #8097FF; --accent-ink: #0A111F; --mark: #FFD84D; --mark-ink: #0E1A2B;
  --ok: #62D39B; --ok-bg: #11301F; --warn: #F2B85A; --warn-bg: #33250C; --bad: #FF8F86; --bad-bg: #3A1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 2rem; line-height: 1.1; }
h2 { font-size: 1.35rem; line-height: 1.2; }
h3 { font-size: 1.05rem; line-height: 1.25; }
p { margin: 0; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 16px 110px; }
.wrap.wide { max-width: 980px; }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
.brand-box { width: 22px; height: 22px; border: 2px solid var(--ink); display: grid; grid-template-columns: 1fr 1fr; }
.brand-box i { border: 1px solid var(--ink); }
.brand-box i:nth-child(2) { background: var(--mark); }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 0.875rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg.full { display: flex; }
.seg.full button { flex: 1; }
.bell { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font-size: 0.875rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.bell b { background: var(--mark); color: var(--mark-ink); border-radius: 999px; padding: 0 7px; font-size: 0.75rem; }
:is(button, select, textarea, input, summary, a):focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.notice { background: var(--mark); color: var(--mark-ink); font-size: 0.8125rem; padding: 6px 16px; text-align: center; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card.flat { padding: 0 16px; }
.hero { padding: 24px 0 8px; display: flex; flex-direction: column; gap: 12px; }
.hl { background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; }
.lead { color: var(--muted); }
.small { font-size: 0.875rem; }
.profile { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 14px 16px; }
.profile:hover { border-color: var(--ink); }
.profile .tag { align-self: flex-start; font-family: var(--mono); font-size: 0.6875rem; border: 1px solid var(--ink); padding: 1px 6px; border-radius: 3px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--ink); background: var(--card); border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 0.9375rem; min-height: 44px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.ghost { border-color: var(--line); font-weight: 500; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 0.8125rem; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.progress { height: 8px; border: 1px solid var(--ink); border-radius: 4px; overflow: hidden; background: var(--card); }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { border: 1px solid var(--ink); background: var(--card); border-radius: 8px; padding: 14px; font-weight: 600; min-height: 52px; }
.opt:hover { background: var(--mark); color: var(--mark-ink); }
.check { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.check:first-of-type { border-top: 0; }
.box { width: 22px; height: 22px; border: 2px solid var(--ink); border-radius: 3px; display: grid; place-items: center; font-size: 14px; line-height: 1; }
.box.on { background: var(--ink); color: var(--paper); }
.fname { color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
.chip { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 0.6875rem; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap; }
.chip.cur { background: var(--mark); color: var(--mark-ink); border-color: var(--mark-ink); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.neutral { background: transparent; color: var(--muted); border-color: var(--line); }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
.tl li:not(:last-child)::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--line); }
.tl li.done:not(:last-child)::before { background: var(--ink); }
.tl .dot { width: 24px; height: 24px; border: 2px solid var(--line); border-radius: 4px; display: grid; place-items: center; font-size: 13px; background: var(--card); }
.tl li.done .dot { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.tl li.now .dot { border-color: var(--ink); background: var(--mark); color: var(--mark-ink); }
.tl li.now .t { background: linear-gradient(transparent 62%, var(--mark) 62%); }
.tl .t { font-weight: 600; }
.msgs { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
.msg { max-width: 88%; padding: 8px 12px; border-radius: 10px; font-size: 0.9375rem; border: 1px solid var(--line); background: var(--paper); overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.msg.sys { align-self: center; background: transparent; border-style: dashed; color: var(--muted); font-size: 0.8125rem; }
.msg small { display: block; font-family: var(--mono); font-size: 0.6875rem; opacity: .7; margin-top: 2px; }
.composer { display: flex; gap: 8px; align-items: stretch; }
.field, .composer input[type="text"], textarea.field, select.field { width: 100%; border: 1px solid var(--ink); border-radius: 8px; padding: 10px 12px; background: var(--card); color: var(--ink); min-height: 44px; }
.composer input[type="text"] { flex: 1; min-width: 0; }
textarea.field { min-height: 84px; resize: vertical; }
label.lbl { display: flex; flex-direction: column; gap: 4px; font-size: 0.875rem; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 12px; }
.tile b { font-family: var(--display); font-size: 1.75rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.op-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .op-grid { grid-template-columns: 330px 1fr; align-items: start; } }
.pcard { width: 100%; text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--line); background: var(--card); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.pcard[aria-current="true"] { border-color: var(--ink); border-left-color: var(--ink); }
.pcard.s-warn { border-left-color: var(--warn); }
.pcard.s-ok { border-left-color: var(--ok); }
.pcard.s-cur { border-left-color: var(--accent); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 0.8125rem; font-weight: 500; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.doc-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.doc-row:first-of-type { border-top: 0; }
.reasons { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.row-btn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 5px 9px; font-size: 0.8125rem; font-weight: 500; min-height: 34px; }
.row-btn.ok { border-color: var(--ok); color: var(--ok); }
.row-btn.bad { border-color: var(--bad); color: var(--bad); }
.row-btn.cur { background: var(--mark); color: var(--mark-ink); border-color: var(--mark-ink); }
.stepper { display: flex; gap: 4px; flex-wrap: wrap; }
.back { border: 0; background: none; padding: 8px 0; font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; }
.empty { color: var(--muted); font-size: 0.9375rem; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--ink); }
.tabbar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { border: 0; background: transparent; padding: 10px 2px 12px; font-size: 0.75rem; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; }
.tabbar button i { width: 18px; height: 18px; border: 2px solid currentColor; border-radius: 3px; display: block; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"] i { background: var(--mark); border-color: var(--ink); }
.optabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; }
.optabs button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 0.875rem; white-space: nowrap; }
.optabs button[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.menu { display: flex; flex-direction: column; }
.menu button { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%; border: 0; border-top: 1px solid var(--line); background: transparent; padding: 14px 0; font-weight: 600; }
.menu button:first-child { border-top: 0; }
.menu button span.lead { font-weight: 400; font-size: 0.8125rem; }
.sw { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; height: 100%; }
.sw span { position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 6px; background: var(--card); pointer-events: none; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 2px; background: var(--ink); transition: transform .15s; }
.sw input:checked + span { background: var(--mark); }
.sw input:checked + span::after { transform: translateX(20px); }
.sw input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.setting:first-child { border-top: 0; }
.days, .slots { display: grid; gap: 8px; }
.days { grid-template-columns: repeat(4, 1fr); }
.slots { grid-template-columns: repeat(3, 1fr); }
.pick { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 4px; font-size: 0.8125rem; font-weight: 600; text-align: center; min-height: 44px; }
.pick[aria-pressed="true"] { background: var(--mark); color: var(--mark-ink); border-color: var(--mark-ink); }
.pick[disabled] { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
.appt { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.appt:first-of-type { border-top: 0; }
.dayb { border: 1px solid var(--ink); border-radius: 6px; text-align: center; padding: 4px 8px; min-width: 56px; font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; line-height: 1.3; }
.dayb b { display: block; font-family: var(--display); font-size: 1.15rem; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--mono); font-size: 0.6875rem; text-transform: uppercase; color: var(--muted); font-weight: 500; border-top: 0; }
.tscroll { overflow-x: auto; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 130px 1fr 34px; gap: 8px; align-items: center; font-size: 0.8125rem; }
.bar i { display: block; height: 14px; background: var(--accent); border-radius: 2px; min-width: 2px; }
.avatar { width: 36px; height: 36px; border: 2px solid var(--ink); border-radius: 6px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--mark); color: var(--mark-ink); flex: none; }
.stars { display: flex; gap: 4px; }
.stars button { border: 1px solid var(--line); background: var(--card); width: 40px; height: 40px; border-radius: 6px; font-weight: 700; }
.stars button[aria-pressed="true"] { background: var(--mark); color: var(--mark-ink); border-color: var(--mark-ink); }
details.faq { border-top: 1px solid var(--line); padding: 10px 0; }
details.faq:first-of-type { border-top: 0; }
details.faq summary { font-weight: 600; cursor: pointer; }
details.faq p { margin-top: 6px; color: var(--muted); font-size: 0.9375rem; }
#toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 0.875rem; z-index: 50; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center; }
#toast.show { opacity: 1; }
/* videochiamata */
#overlay[hidden] { display: none; }
#overlay { position: fixed; inset: 0; z-index: 40; background: #080D18; color: #EEF2FA; display: flex; flex-direction: column; }
.call-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #1E2A42; }
.call-top .mono { color: #9AA8C2; }
.call-stage { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 12px; grid-template-columns: 1fr; grid-template-rows: 1fr auto; position: relative; }
@media (min-width: 820px) { .call-stage.has-side { grid-template-columns: 1fr 320px; grid-template-rows: 1fr; } }
.tile-v { position: relative; border: 1px solid #25314A; border-radius: 12px; background: #0F1830; display: grid; place-items: center; overflow: hidden; min-height: 180px; }
.big-av { width: 96px; height: 96px; border-radius: 16px; border: 3px solid #EEF2FA; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 2.2rem; background: #FFD84D; color: #0E1A2B; }
.big-av.talk { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 216, 77, .5); } 50% { box-shadow: 0 0 0 14px rgba(255, 216, 77, 0); } }
@media (prefers-reduced-motion: reduce) { .big-av.talk { animation: none; } }
.tile-name { position: absolute; left: 10px; bottom: 8px; font-size: 0.8125rem; background: rgba(0, 0, 0, .55); padding: 2px 8px; border-radius: 4px; }
.self-v { position: absolute; right: 10px; top: 10px; width: 112px; height: 84px; border: 2px solid #EEF2FA; border-radius: 10px; background: #16213D; display: grid; place-items: center; font-size: 0.75rem; text-align: center; padding: 4px; }
.cap { position: absolute; left: 12px; right: 12px; bottom: 36px; background: rgba(0, 0, 0, .7); padding: 6px 10px; border-radius: 6px; font-size: 0.9375rem; text-align: center; }
.share-doc { background: #fff; color: #0E1A2B; border-radius: 8px; padding: 14px; width: min(92%, 420px); max-height: 85%; overflow: auto; font-size: 0.875rem; }
.share-doc .ln { height: 8px; background: #DDE3EE; border-radius: 3px; margin: 6px 0; }
.side { border: 1px solid #25314A; border-radius: 12px; background: #0F1830; display: flex; flex-direction: column; min-height: 220px; max-height: 100%; overflow: hidden; }
.side .msgs { padding: 10px; max-height: none; flex: 1; }
.side .msg { background: #16213D; border-color: #25314A; color: #EEF2FA; }
.side .msg.me { background: #FFD84D; color: #0E1A2B; border-color: #FFD84D; }
.side form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #25314A; }
.side input[type="text"] { flex: 1; min-width: 0; background: #16213D; border: 1px solid #25314A; color: #EEF2FA; border-radius: 6px; padding: 8px; }
.ctrls { display: flex; justify-content: center; gap: 10px; padding: 12px; border-top: 1px solid #1E2A42; flex-wrap: wrap; }
.ctrl { border: 1px solid #3A4868; background: #16213D; color: #EEF2FA; border-radius: 10px; padding: 10px 14px; font-size: 0.8125rem; font-weight: 600; min-height: 46px; min-width: 76px; }
.ctrl[aria-pressed="true"] { background: #FFD84D; color: #0E1A2B; border-color: #FFD84D; }
.ctrl.off { background: #3A1714; border-color: #FF8F86; color: #FF8F86; }
.ctrl.end { background: #D8372B; border-color: #D8372B; color: #fff; }
.lobby { margin: auto; width: min(94%, 460px); display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.lobby .tile-v { min-height: 200px; }

<script>
"use strict";
/* ============ utilità ============ */
var pad = function (n) { return String(n).padStart(2, "0"); };
var isoDate = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
var plusDays = function (n) { var d = new Date(); d.setDate(d.getDate() + n); return isoDate(d); };
var dayParts = function (iso) { var d = new Date(iso + "T12:00:00"); return { w: d.toLocaleDateString("it-IT", { weekday: "short" }), n: d.getDate(), m: d.toLocaleDateString("it-IT", { month: "short" }) }; };
var dayLabel = function (iso) { return new Date(iso + "T12:00:00").toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" }); };
var nowT = function () { return new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }); };
var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  pr.base.forEach(function (d) { seen[d.id] = 1; out.push({ id: d.id, label: d.label, file: null }); });

function setStatus(p, s) {
  if (s === "Pronta per la firma" && p.docs.some(function (d) { return d.state !== "ok"; })) { toast("Approva prima tutti i documenti."); return false; }
  if (s === "Inviata" && !p.visto) { toast("Serve il visto di conformità del responsabile."); return false; }
  if (s === "Inviata" && !p.signed) { toast("Il cliente deve ancora firmare."); return false; }
  p.status = s;
  if (s === "Inviata") { p.protocol = "PROT-" + new Date().getFullYear() + "-" + (10000 + Math.floor(Math.random() * 89999)); audit(p, "Pratica inviata, protocollo " + p.protocol); } else { audit(p, "Stato: " + s); }

}

  else if (kind === "support") { if (v("s") && v("b")) { S.tickets.unshift({ s: v("s"), when: "Oggi " + nowT() }); toast("Richiesta inviata."); } }
  else if (kind === "assist") { assistAsk(v("t")); refocus = "assist-q"; }
  else if (kind === "team") { if (v("n")) { team.push({ name: v("n"), role: v("r"), load: 0 }); toast("Persona aggiunta."); } }
  else if (kind === "call-chat") { var tt = v("t"); if (tt && S.call) { S.call.chat.push({ me: true, text: tt }); refocus = "call-chat-in"; } }
  render();
  if (refocus) { var el = document.getElementById(refocus); if (el) el.focus(); }
});
applyPrefs();
render();
</script>
</body>
</html>
